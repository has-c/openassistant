services:
  whisper:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      WHISPER_MODEL: base.en
    volumes:
      - whisper-model-cache:/home/whisper/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5m
    cpus: 2
    mem_limit: 4g

volumes:
  whisper-model-cache:
