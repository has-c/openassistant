name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    name: Preview tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: openassistant-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview and test dependencies
        run: python -m pip install '.[test]'
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Check queue interaction
        run: python tests/browser_text_queue.py

  legacy-and-compose:
    name: Legacy imports and compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install legacy dependencies under test
        run: python .github/scripts/install_legacy_dependencies.py
      - name: Check desktop imports
        run: python -c 'from llama_cpp import ChatCompletionMessage, Llama; from PIL import Image, ImageTk; import certifi'
      - name: Check Whisper service dependency resolution
        run: python -m pip install -r speech/whisper/requirements.txt
      - name: Validate speech configurations
        run: |
          docker compose -f speech/compose.yaml config -q
          docker compose -f speech/whisper/compose.yaml config -q
